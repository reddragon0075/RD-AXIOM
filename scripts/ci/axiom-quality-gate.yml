name: Axiom Quality Gate & Brand Sanitization

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Seam, Secret & Zero-Trace Brand Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx

      - name: Execute Static Seam, Secret & Brand Term Check
        run: |
          python scripts/check_contracts_and_secrets.py

      - name: Run Backend Pytest Suite
        run: |
          pytest fleetline-mvp/tests/

      - name: Run Tri-Stack Hardening Specification Suite
        run: |
          python fleetline-mvp/test_tristack_suite.py

      - name: Run Frontend Seam & Resilience Tests
        run: |
          node --test frontend/tests/*.test.js
