openapi: 3.1.0
info:
  title: Axiom Fleet Operations API
  version: 2026.09
  description: >-
    Organization-scoped API contract for the Axiom Fleet local fallback and
    Supabase production adapter. External providers are mock adapters until
    project credentials are configured.
servers:
  - url: /
    description: Same-origin deployment
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Operations
  - name: Execution
  - name: Enterprise
  - name: Finance
  - name: Governance
  - name: Network
  - name: Phase 3 intelligence
paths:
  /api/health:
    get:
      security: []
      tags: [Operations]
      responses:
        '200': {description: Healthy service}
  /api/auth/login:
    post:
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}
      responses:
        '200': {description: Authenticated session}
        '401': {description: Invalid credentials}
  /api/auth/signup:
    post:
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/SignupRequest'}}
      responses:
        '201': {description: Account created}
  /api/auth/password-reset:
    post:
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}
      responses:
        '202': {description: Reset request accepted without account enumeration}
  /api/auth/password-reset/confirm:
    post:
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [token, password], properties: {token: {type: string}, password: {type: string, minLength: 8}}}}
      responses:
        '200': {description: Password updated and existing sessions revoked}
        '400': {description: Invalid or expired token}
  /api/auth/me:
    get:
      tags: [Auth]
      responses:
        '200': {description: Current user}
  /api/webhooks/payments:
    post:
      security: []
      tags: [Finance]
      parameters:
        - {in: header, name: X-Payment-Signature, required: true, schema: {type: string}}
        - {in: header, name: X-Payment-Timestamp, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [event_id, event_type, organization_id], properties: {event_id: {type: string}, event_type: {type: string}, organization_id: {type: string}, payment_link_id: {type: string}, provider_reference: {type: string}}}}
      responses:
        '200': {description: Verified, replay-safe webhook result}
        '401': {description: Invalid, missing or stale signature}
  /api/onboarding:
    get:
      tags: [Operations]
      responses:
        '200': {description: Server-side onboarding progress}
    patch:
      tags: [Operations]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/OnboardingPatch'}}
      responses:
        '200': {description: Step saved}
  /api/bookings:
    get:
      tags: [Operations]
      responses:
        '200': {description: Organization-scoped bookings}
    post:
      tags: [Operations]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/BookingRequest'}}
      responses:
        '201': {description: Booking created}
        '409': {description: Active corporate policy blocked the request; response includes explainable evaluation details}
  /api/bookings/{bookingId}:
    parameters: [{in: path, name: bookingId, required: true, schema: {type: string}}]
    get:
      tags: [Operations]
      responses: {'200': {description: Organization-scoped booking}}
    patch:
      tags: [Operations]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/BookingRequest'}}
      responses:
        '200': {description: Booking updated}
        '409': {description: Active corporate policy blocked a related mutation}
  /api/bookings/{bookingId}/{action}:
    parameters:
      - in: path
        name: bookingId
        required: true
        schema: {type: string}
      - in: path
        name: action
        required: true
        schema: {type: string, enum: [approve, confirm, reject, cancel, assign]}
    post:
      tags: [Operations]
      requestBody:
        content:
          application/json: {schema: {type: object}}
      responses:
        '201': {description: Booking action applied}
        '409': {description: Corporate cancellation cutoff or transition guard blocked the action}
  /api/bookings/recurring:
    get:
      tags: [Operations]
      responses:
        '200': {description: Recurring booking series}
    post:
      tags: [Operations]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RecurringBookingRequest'}}
      responses:
        '201': {description: Series and generated instances}
  /api/bookings/{bookingId}/stops:
    parameters: [{in: path, name: bookingId, required: true, schema: {type: string}}]
    get:
      tags: [Operations]
      responses: {'200': {description: Multi-stop route plan}}
    post:
      tags: [Operations]
      requestBody:
        content:
          application/json: {schema: {type: object, required: [stops], properties: {stops: {type: array, items: {$ref: '#/components/schemas/Stop'}}}}}
      responses: {'201': {description: Stops saved}}
  /api/duties/{dutyId}:
    parameters: [{in: path, name: dutyId, required: true, schema: {type: string}}]
    patch:
      tags: [Execution]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/DutyTransition'}}
      responses: {'200': {description: Duty transition}}
  /api/duties/{dutyId}/proof:
    parameters: [{in: path, name: dutyId, required: true, schema: {type: string}}]
    post:
      tags: [Execution]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/ProofRequest'}}
      responses: {'201': {description: Duty proof recorded}}
  /api/sync/replay:
    post:
      tags: [Execution]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/SyncReplayRequest'}}
      responses: {'200': {description: Idempotent replay result}}
  /api/tax/calculate:
    post:
      tags: [Finance]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/TaxRequest'}}
      responses: {'200': {description: CGST/SGST or IGST result}}
  /api/supplier-bills:
    get: {tags: [Finance], responses: {'200': {description: Supplier bill ledger}}}
    post:
      tags: [Finance]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/SupplierBillRequest'}}
      responses: {'201': {description: Captured supplier bill}}
  /api/costs:
    get: {tags: [Finance], responses: {'200': {description: Cost ledger}}}
    post:
      tags: [Finance]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/CostRequest'}}
      responses: {'201': {description: Cost recorded}}
  /api/payment-links:
    get: {tags: [Finance], responses: {'200': {description: Payment links}}}
    post:
      tags: [Finance]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/PaymentLinkRequest'}}
      responses: {'201': {description: Mock payment link}}
  /api/public/payment-links/{shortCode}:
    parameters: [{in: path, name: shortCode, required: true, schema: {type: string}}]
    get:
      security: []
      tags: [Finance]
      responses: {'200': {description: Safe payment context}}
    post:
      security: []
      tags: [Finance]
      requestBody:
        content:
          application/json: {schema: {type: object, properties: {action: {type: string, enum: [pay]}}}}
      responses: {'200': {description: Mock payment captured}}
  /api/financial-actions:
    post:
      tags: [Finance]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/FinancialActionRequest'}}
      responses: {'201': {description: Pending maker-checker action}}
  /api/updates:
    get:
      tags: [Operations]
      responses: {'200': {description: Polling cursor and operational events}}
  /api/network/edges:
    get: {tags: [Network], responses: {'200': {description: Associate relationships}}}
    post:
      tags: [Network]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkEdgeRequest'}}
      responses: {'201': {description: Partner relationship}}
  /api/network/v1/feature-flag:
    get: {tags: [Network], responses: {'200': {description: Tenant Network feature flag}}}
    post:
      tags: [Network]
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}}
      responses: {'200': {description: Feature flag updated}}
  /api/network/v1/invites:
    get: {tags: [Network], responses: {'200': {description: Buyer-owned invite directory}}}
    post:
      tags: [Network]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkInviteRequest'}}
      responses: {'200': {description: Invite created or replayed}}
  /api/network/v1/vendor-profiles:
    get: {tags: [Network], responses: {'200': {description: Authorized vendor profiles}}}
    post:
      tags: [Network]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkVendorProfileRequest'}}
      responses: {'200': {description: Invited vendor profile}}
  /api/network/v1/programs:
    get: {tags: [Network], responses: {'200': {description: Tenant Network programs}}}
    post:
      tags: [Network]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkProgramRequest'}}
      responses: {'200': {description: Program created}}
  /api/network/v1/programs/{program_id}/requirements:
    parameters: [{name: program_id, in: path, required: true, schema: {type: string}}]
    get: {tags: [Network], responses: {'200': {description: Program requirements}}}
    post:
      tags: [Network]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkRequirementRequest'}}
      responses: {'200': {description: Draft requirement with version one}}
  /api/network/v1/requirements/{requirement_id}/versions/{version}/publish:
    parameters:
      - {name: requirement_id, in: path, required: true, schema: {type: string}}
      - {name: version, in: path, required: true, schema: {type: integer}}
    post: {tags: [Network], responses: {'200': {description: Published immutable requirement version}}}
  /api/network/v1/requirements/{requirement_id}/match:
    parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Network]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/IdempotentCommand'}}
      responses: {'200': {description: Deterministic eligibility and explainable ranking}}
  /api/network/v1/requirements/{requirement_id}/quotes:
    parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
    get: {tags: [Network], responses: {'200': {description: Confidential quote surface}}}
    post:
      tags: [Network]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkQuoteRequest'}}
      responses: {'200': {description: Immutable quote version}}
  /api/network/v1/requirements/{requirement_id}/comparisons:
    parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
    get: {tags: [Network], responses: {'200': {description: Buyer comparison snapshots}}}
    post:
      tags: [Network]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkComparisonRequest'}}
      responses: {'200': {description: Immutable comparison snapshot}}
  /api/network/v1/requirements/{requirement_id}/awards:
    parameters: [{name: requirement_id, in: path, required: true, schema: {type: string}}]
    get: {tags: [Network], responses: {'200': {description: Requirement awards}}}
    post:
      tags: [Network]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkAwardRequest'}}
      responses: {'200': {description: Pending-approval award}}
  /api/network/v1/awards/{award_id}/approve:
    parameters: [{name: award_id, in: path, required: true, schema: {type: string}}]
    post: {tags: [Network], responses: {'200': {description: Approved award with contract and checks}}}
  /api/network/v1/awards/{award_id}/activate:
    parameters: [{name: award_id, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Network]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/IdempotentCommand'}}
      responses:
        '200': {description: Fleet-linked service order}
        '409': {description: Activation blocked by lifecycle, contract or readiness checks}
  /api/network/v1/service-orders:
    get: {tags: [Network], responses: {'200': {description: Fleet-linked Network service orders}}}
  /api/network/v1/service-orders/{service_order_id}/scorecards:
    parameters: [{name: service_order_id, in: path, required: true, schema: {type: string}}]
    get: {tags: [Network], responses: {'200': {description: Evidence-backed scorecards}}}
    post:
      tags: [Network]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkEvidenceRequest'}}
      responses: {'200': {description: Scorecard recorded}}
  /api/network/v1/service-orders/{service_order_id}/settlements:
    parameters: [{name: service_order_id, in: path, required: true, schema: {type: string}}]
    get: {tags: [Network], responses: {'200': {description: Evidence-backed settlement drafts}}}
    post:
      tags: [Network]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/NetworkSettlementRequest'}}
      responses: {'200': {description: Settlement recorded}}
  /api/network/v1/partner-directory:
    get:
      tags: [Network]
      summary: List verified invite-derived partner profiles
      parameters: [{name: q, in: query, schema: {type: string}}, {name: status, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer, maximum: 500}}]
      responses: {'200': {description: Verified tenant-scoped partner directory}}
  /api/network/v1/associates:
    get: {tags: [Network], summary: List buyer and associate relationship states, responses: {'200': {description: Associate lifecycle records}}}
  /api/network/v1/associates/{associate_id}/{action}:
    post:
      tags: [Network]
      parameters: [{name: associate_id, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {type: string, enum: [accept, reject, revoke]}}]
      requestBody: {content: {application/json: {schema: {type: object, properties: {acceptance_note: {type: string}}}}}}
      responses: {'200': {description: Associate lifecycle transition}}
  /api/network/v1/invites/{invite_id}/{action}:
    post:
      tags: [Network]
      parameters: [{name: invite_id, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {type: string, enum: [accept, reject, revoke]}}]
      responses: {'200': {description: Invite acceptance or revocation}}
  /api/network/v1/contracts:
    get: {tags: [Network], responses: {'200': {description: Network contracts and synchronization state}}}
  /api/network/v1/contracts/{contract_id}:
    get:
      tags: [Network]
      parameters: [{name: contract_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Contract with immutable versions and rate cards}}
  /api/network/v1/contracts/{contract_id}/versions:
    get: {tags: [Network], parameters: [{name: contract_id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Contract versions}}}
    post:
      tags: [Network]
      parameters: [{name: contract_id, in: path, required: true, schema: {type: string}}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/NetworkContractVersionRequest'}}}}
      responses: {'200': {description: Published or associate-accepted contract version}}
  /api/network/v1/contracts/{contract_id}/sync:
    get: {tags: [Network], parameters: [{name: contract_id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Contract synchronization envelopes}}}
    post:
      tags: [Network]
      parameters: [{name: contract_id, in: path, required: true, schema: {type: string}}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/IdempotentCommand'}}}}
      responses: {'200': {description: Idempotent contract synchronization request}}
  /api/network/v1/service-orders/{service_order_id}/exchanges:
    parameters: [{name: service_order_id, in: path, required: true, schema: {type: string}}]
    get: {tags: [Network], responses: {'200': {description: Booking, duty-slip, invoice and operational-message envelopes}}}
    post:
      tags: [Network]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NetworkExchangeRequest'}}}}
      responses: {'200': {description: Idempotent exchange envelope}}
  /api/network/v1/exchanges/{exchange_id}/{action}:
    post:
      tags: [Network]
      parameters: [{name: exchange_id, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {type: string, enum: [acknowledge, reject, process]}}]
      responses: {'200': {description: Exchange acknowledgement or rejection}}
  /api/network/v1/service-orders/{service_order_id}/sla-observations:
    get: {tags: [Network], responses: {'200': {description: Supplier SLA observations}}}
    post:
      tags: [Network]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/NetworkSlaObservationRequest'}}}}
      responses: {'200': {description: SLA observation}}
  /api/network/v1/service-orders/{service_order_id}/issues:
    get: {tags: [Network], responses: {'200': {description: Supplier issue and rejection workflow}}}
    post:
      tags: [Network]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/NetworkSupplierIssueRequest'}}}}
      responses: {'200': {description: Supplier issue}}
  /api/network/v1/service-orders/{service_order_id}/rate-discrepancies:
    get: {tags: [Network], responses: {'200': {description: Supplier rate discrepancies}}}
    post:
      tags: [Network]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/NetworkRateDiscrepancyRequest'}}}}
      responses: {'200': {description: Rate discrepancy}}
  /api/network/v1/service-orders/{service_order_id}/settlement-resolutions:
    get: {tags: [Network], responses: {'200': {description: Settlement dispute resolutions}}}
    post:
      tags: [Network]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/NetworkSettlementResolutionRequest'}}}}
      responses: {'200': {description: Proposed settlement resolution}}
  /api/network/v1/{resource}/{resource_id}/{action}:
    post:
      tags: [Network]
      parameters: [{name: resource, in: path, required: true, schema: {type: string, enum: [issues, rate-discrepancies, settlement-resolutions]}}, {name: resource_id, in: path, required: true, schema: {type: string}}, {name: action, in: path, required: true, schema: {type: string, enum: [resolve, decide]}}]
      responses: {'200': {description: Supplier issue or settlement resolution decision}}
  /api/reports/export:
    post:
      tags: [Governance]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/ExportRequest'}}
      responses: {'202': {description: Export job or ready export}}
  /api/security/2fa/setup:
    post:
      tags: [Governance]
      responses: {'200': {description: Mock factor enrollment contract}}
  /api/security/2fa/verify:
    post:
      tags: [Governance]
      requestBody:
        content:
          application/json: {schema: {type: object, required: [code], properties: {code: {type: string}}}}
      responses: {'200': {description: Factor enabled}}
  /api/privacy/requests:
    get: {tags: [Governance], responses: {'200': {description: Privacy request ledger}}}
    post:
      tags: [Governance]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/PrivacyRequest'}}
      responses: {'201': {description: Privacy request recorded}}
  /api/masters:
    get:
      tags: [Governance]
      responses:
        '200': {description: P0 master catalogue and tenant-scoped counts}
  /api/masters/{kind}:
    get:
      tags: [Governance]
      parameters:
        - {$ref: '#/components/parameters/Kind'}
      responses:
        '200': {description: Tenant-scoped master records}
    post:
      tags: [Governance]
      parameters:
        - {$ref: '#/components/parameters/Kind'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/P0MasterRequest'}}
      responses:
        '200': {description: Versioned master created}
  /api/masters/{kind}/{master_id}:
    get:
      tags: [Governance]
      parameters:
        - {$ref: '#/components/parameters/Kind'}
        - {$ref: '#/components/parameters/MasterId'}
      responses:
        '200': {description: Master record with immutable versions}
    patch:
      tags: [Governance]
      parameters:
        - {$ref: '#/components/parameters/Kind'}
        - {$ref: '#/components/parameters/MasterId'}
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/P0MasterRequest'}}
      responses:
        '200': {description: Master version created}
  /api/masters/{kind}/{master_id}/{action}:
    post:
      tags: [Governance]
      parameters:
        - {$ref: '#/components/parameters/Kind'}
        - {$ref: '#/components/parameters/MasterId'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [archive, restore]}
      responses:
        '200': {description: Master status transition}
  /api/operations/sites:
    get:
      tags: [Operations]
      responses:
        '200': {description: Tenant-scoped operating sites}
    post:
      tags: [Operations]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/P0SiteRequest'}}
      responses:
        '200': {description: Operating site created}
  /api/operations/route-plans:
    get:
      tags: [Operations]
      responses:
        '200': {description: Route-plan versions}
    post:
      tags: [Operations]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/P0RoutePlanRequest'}}
      responses:
        '200': {description: Draft route plan with ordered stops}
  /api/operations/route-plans/{route_plan_id}/publish:
    post:
      tags: [Operations]
      parameters:
        - {$ref: '#/components/parameters/RoutePlanId'}
      responses:
        '200': {description: Published route plan}
        '409': {description: Infeasible or invalid transition}
  /api/operations/dispatch-board:
    get:
      tags: [Operations]
      responses:
        '200': {description: Assignment offers and acceptance deadlines}
  /api/operations/assignments:
    post:
      tags: [Operations]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/P0AssignmentRequest'}}
      responses:
        '200': {description: Assignment offer}
  /api/operations/assignments/{assignment_id}/{action}:
    post:
      tags: [Operations]
      parameters:
        - {$ref: '#/components/parameters/AssignmentId'}
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [accept, reject, expire]}
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/IdempotencyRequest'}}
      responses:
        '200': {description: Assignment transition}
        '409': {description: Invalid transition}
  /api/operations/replacements:
    get:
      tags: [Operations]
      responses:
        '200': {description: Replacement queue}
    post:
      tags: [Operations]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/P0ReplacementRequest'}}
      responses:
        '200': {description: Replacement work item}
  /api/safety/policies:
    get:
      tags: [Governance]
      responses:
        '200': {description: Active versioned safety policies}
    post:
      tags: [Governance]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/P0SafetyPolicyRequest'}}
      responses:
        '200': {description: Safety policy version}
  /api/safety/incidents:
    get:
      tags: [Governance]
      responses:
        '200': {description: Tenant-scoped incident queue}
    post:
      tags: [Governance]
      requestBody:
        content:
          application/json: {schema: {$ref: '#/components/schemas/P0IncidentRequest'}}
      responses:
        '200': {description: Open incident with escalation deadline}
