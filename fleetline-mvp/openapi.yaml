    post:
      tags: [Enterprise]
      summary: Upsert values for an enterprise custom field
      responses: {"200": {description: Values saved}}
  /api/finance/budgets:
    get:
      tags: [Finance]
      responses: {"200": {description: Budgets returned}}
    post:
      tags: [Finance]
      summary: Save a corporate expense budget
      responses: {"200": {description: Budget saved}}
  /api/finance/expense-forecast:
    get:
      tags: [Finance]
      summary: Return an explainable three-month deterministic expense forecast
      responses: {"200": {description: Forecast returned}}

  /api/workspace/next-actions:
    get:
      tags: [Operations]
      summary: Return the tenant-scoped exception-first action queue
      description: >-
        Projects canonical bookings, duties, driver readiness, safety,
        evidence and finance records into explainable next actions. The
        projection does not create a second trip ledger.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 50, default: 12}
      responses:
        '200':
          description: Explainable action queue and summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceActionCenterResponse'}
        '401': {description: Authentication required}
  /api/workspace/next-actions/{action_id}/status:
    post:
      tags: [Operations]
      summary: Acknowledge, snooze, resolve or reopen a workspace action
      parameters:
        - in: path
          name: action_id
          required: true
          schema: {type: string, maxLength: 180}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [acknowledged, snoozed, resolved, reopened]}
                snooze_until: {type: string, format: date-time}
                note: {type: string, maxLength: 500}
      responses:
        '200': {description: Per-user action state saved with an audit reference}
        '400': {description: Invalid action state}
        '403': {description: Action-center permission required}

